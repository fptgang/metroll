spring:
  application:
    name: account-service

  docker:
    compose:
      enabled: false

  jackson:
    default-property-inclusion: non_null

  data:
    mongodb:
      uri: ${DATABASE_ACCOUNT_SERVICE}
      ssl: {enabled: true}

  cloud:
    stream:
      bindings:
        loginAttempt-out-0:
          destination: loginAttempt
          content-type: application/json
        loginAttempt-in-0:
          destination: loginAttempt
          content-type: application/json
      rabbit:
        bindings:
          loginAttempt-out-0:
            producer:
              exchangeType: fanout
              routingKey: loginAttempt
          loginAttempt-in-0:
            consumer:
              exchangeType: fanout
              queueName: loginAttempt
              bindingRoutingKey: loginAttempt

  rabbitmq:
    host: ${CLOUDAMQP_HOST}
    port: ${CLOUDAMQP_PORT}
    username: ${CLOUDAMQP_USERNAME}
    password: ${CLOUDAMQP_PASSWORD}
    publisher-confirms: true
    virtual-host: ${CLOUDAMQP_VHOST}
    ssl:
      enabled: true

  main:
    allow-bean-definition-overriding: true

server:
  forward-headers-strategy: framework

metroll:
  exception:
    log: true
  email:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    protocol: smtp
    auth: ${EMAIL_AUTH:true}
    starttls: ${EMAIL_STARTTLS:true}
    debug: ${EMAIL_DEBUG:false}
    from-email: ${EMAIL_FROM:noreply@metroll.com}
    from-name: ${EMAIL_FROM_NAME:Metroll}
    connection-timeout: 5000
    timeout: 5000
    write-timeout: 5000

springdoc:
  cache:
    disabled: true
  version: '@springdoc.version@'

eureka:
  client:
    service-url:
      defaultZone: http://service-registry.metroll:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
